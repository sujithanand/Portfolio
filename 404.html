<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Page Not Found | Sujith Anand</title>
	<meta name="description" content="That page doesn’t exist. Head back to the homepage for selected work and articles.">
	<meta name="robots" content="noindex">

	<link rel="icon" href="img/favicon.png" sizes="180x180">
	<link rel="icon" href="img/favicon-512.png" sizes="512x512">
	<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	<link rel="stylesheet" href="css/tokens.css">
	<link rel="stylesheet" href="css/base.css">
	<style>
		:root {
			--container: 720px;
		}

		body {
			line-height: 1.7;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: var(--space-5) var(--space-3);
		}

		.panel {
			width: min(100%, var(--container));
			background: var(--surface);
			border-radius: var(--radius);
			box-shadow: var(--shadow-panel);
			border: 1px solid rgba(0, 0, 0, 0.05);
			padding: var(--space-5) var(--space-4);
			text-align: center;
		}

		.code {
			font-size: clamp(64px, 12vw, 104px);
			font-weight: 800;
			line-height: 1;
			color: var(--accent);
			letter-spacing: -0.03em;
		}

		h1 {
			margin: var(--space-2) 0 var(--space-1);
			font-size: clamp(24px, 4vw, 30px);
		}

		p {
			color: var(--muted);
			margin: 0 auto var(--space-4);
			max-width: 46ch;
		}

		.actions {
			display: flex;
			flex-wrap: wrap;
			gap: var(--space-1);
			justify-content: center;
		}

		.actions a {
			padding: 10px 20px;
			border-radius: var(--radius-pill);
			border: 1px solid var(--line-strong);
			font-weight: 600;
			color: var(--text);
		}

		.actions a.primary {
			background: var(--accent);
			border-color: var(--accent);
			color: #fff;
		}
	</style>
</head>

<body>
	<main class="panel">
		<div class="code">404</div>
		<h1>This page doesn’t exist</h1>
		<p>The link may be out of date. Everything lives on the homepage: selected work, case studies, and
			articles.</p>
		<div class="actions">
			<a class="primary" href="/">Go to homepage</a>
			<a href="/#selected-work">Selected work</a>
			<a href="/#articles">Articles</a>
		</div>
	</main>
</body>

</html>

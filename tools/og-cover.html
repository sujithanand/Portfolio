<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;font-family:"Nunito",sans-serif;background:#fbfbfd;
     display:flex;align-items:center;overflow:hidden;position:relative}
.bar{position:absolute;inset:0 0 auto 0;height:10px;background:#2563eb}
.glow{position:absolute;right:-160px;top:-160px;width:620px;height:620px;border-radius:50%;
      background:radial-gradient(circle,rgba(37,99,235,.16),rgba(37,99,235,0) 70%)}
.copy{padding:0 72px;max-width:760px;position:relative;z-index:2}
.eyebrow{font-size:20px;letter-spacing:.24em;text-transform:uppercase;color:#2563eb;font-weight:700;margin-bottom:26px}
h1{font-size:76px;line-height:1.05;color:#111;font-weight:800;letter-spacing:-.02em}
.role{margin-top:22px;font-size:31px;line-height:1.4;color:#5c6473;font-weight:600}
.chips{margin-top:38px;display:flex;gap:12px;flex-wrap:wrap}
.chip{padding:10px 22px;border-radius:999px;background:rgba(37,99,235,.10);color:#2563eb;font-size:20px;font-weight:700}
.portrait{position:absolute;right:40px;bottom:0;height:600px;z-index:1}
</style></head><body>
<div class="bar"></div><div class="glow"></div>
<img class="portrait" src="../img/portrait.png">
<div class="copy">
  <div class="eyebrow">Head of Design &middot; GRC</div>
  <h1>Sujith Anand</h1>
  <div class="role">Sole design function for a ~$100M ARR portfolio of 13 enterprise products</div>
  <div class="chips"><span class="chip">Design Systems</span><span class="chip">AI-Driven UX</span><span class="chip">Team of 5</span></div>
</div></body></html>

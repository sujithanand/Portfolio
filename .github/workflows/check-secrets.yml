# Blocks a secret from reaching the published site.
#
# Everything committed here is served by GitHub Pages exactly as it is, so a
# key in any tracked file is a key handed to every visitor. This workflow is
# a check only. It deliberately does NOT build or deploy: adding a deployment
# workflow would replace the default Jekyll build, and _config.yml relies on
# that build to keep the old v1 pages out of the published site.
name: check-secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan published files for credentials
        run: python3 tools/check-secrets.py
